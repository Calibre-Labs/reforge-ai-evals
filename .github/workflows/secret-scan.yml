name: Secret scan

# Fails a pull request or push that adds an API key, token or password.
# Scans only the new commits, so secrets that were already removed and
# revoked in old history don't fail every run.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      # Installed through the Go module proxy, which verifies the download
      # against the public checksum database. Bump the version deliberately.
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$PUSH_BEFORE..$PUSH_AFTER"
          else
            RANGE="$PUSH_AFTER~1..$PUSH_AFTER"
          fi
          echo "Scanning $RANGE"
          "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --log-opts="$RANGE" .
