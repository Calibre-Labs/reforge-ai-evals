# GitHub Pages (Jekyll) settings
title: "AI Evals Toolkit: LLM judges, eval datasets and rubrics"
description: "Open-source toolkit for evaluating AI agents: LLM-as-a-judge templates, code evaluators, the User Input Grid for eval dataset design, AI PRD and eval rubric templates, and skills for AI coding agents. From the Reforge AI Evals course by Calibre."
tagline: "Open-source AI evals toolkit by Calibre"
author: "Sandhya Hegde and Justin Bauer (Calibre)"
url: "https://calibre-labs.github.io"
baseurl: "/reforge-ai-evals"
theme: jekyll-theme-primer
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
include:
  - llms.txt
exclude:
  - scripts/
